name: pair_app
description: A private space for two people, anywhere in the world.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.5.0
  intl: ^0.19.0
  flutter_timezone: ^2.1.0
  uuid: ^4.4.0
  shared_preferences: ^2.2.3
  geolocator: ^12.0.0
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  google_fonts: ^6.2.1
  timezone: ^0.9.4
  flutter_local_notifications: ^17.2.2
  flutter_webrtc: ^0.11.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
